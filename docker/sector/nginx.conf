server {
    listen 443 ssl;
    server_name sector-magalu sector-magalupay sector-magalufresh sector-netshoes;
    ssl_certificate /etc/sector/tls/sector.crt;
    ssl_certificate_key /etc/sector/tls/sector.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/sectors/[a-z0-9_-]+\.json$ {
        proxy_pass http://demo:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
