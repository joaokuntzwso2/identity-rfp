# Optional second user store. WSO2 integration must still be configured and verified.
services:
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Magalu POC External Directory"
      LDAP_DOMAIN: "example.test"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD}"
      LDAP_TLS: "false"
    command: "--copy-service"
    volumes:
      - ./docker/ldap/seed-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seller.ldif:ro
    ports:
      - "127.0.0.1:1389:389"
    networks: [poc]
